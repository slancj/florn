<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramjet Web Proxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Scramjet & BareMux scripts -->
  <script src="/baremux/index.js"></script>
  <script src="/scramjet/scramjet.all.js"></script>
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon">🚀</div>
        <div class="logo-text">
          <h1>Scramjet</h1>
          <span class="subtitle">Next-Gen Web Proxy</span>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Initializing...</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Launcher Section -->
      <section class="search-section" id="searchSection">
        <div class="hero">
          <h2>Browse the Web Freely</h2>
          <p>Fast, secure, and customizable web proxy powered by Scramjet and Wisp.</p>
        </div>

        <form class="search-form" id="searchForm">
          <div class="input-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="urlInput" placeholder="Search with DuckDuckGo or enter a URL (e.g. example.com)..."
              autocomplete="off" required>
            <button type="submit" class="launch-btn" id="launchBtn">
              <span>Go</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <!-- Quick Launch Apps -->
        <div class="quick-launch">
          <h3>Popular Sites</h3>
          <div class="grid">
            <button class="shortcut-card" data-url="https://duckduckgo.com">
              <span class="card-icon">🦆</span>
              <span class="card-title">DuckDuckGo</span>
            </button>
            <button class="shortcut-card" data-url="https://google.com">
              <span class="card-icon">🔍</span>
              <span class="card-title">Google</span>
            </button>
            <button class="shortcut-card" data-url="https://wikipedia.org">
              <span class="card-icon">📚</span>
              <span class="card-title">Wikipedia</span>
            </button>
            <button class="shortcut-card" data-url="https://github.com">
              <span class="card-icon">🐙</span>
              <span class="card-title">GitHub</span>
            </button>
            <button class="shortcut-card" data-url="https://reddit.com">
              <span class="card-icon">🤖</span>
              <span class="card-title">Reddit</span>
            </button>
            <button class="shortcut-card" data-url="https://huggingface.co">
              <span class="card-icon">🤗</span>
              <span class="card-title">Hugging Face</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Proxy Browser Iframe Window -->
      <section class="browser-container hidden" id="browserContainer">
        <div class="browser-toolbar">
          <div class="nav-controls">
            <button class="tool-btn" id="btnHome" title="Home">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </button>
            <button class="tool-btn" id="btnBack" title="Back">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </button>
            <button class="tool-btn" id="btnForward" title="Forward">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
            <button class="tool-btn" id="btnReload" title="Reload">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>
          </div>

          <div class="address-bar">
            <span class="security-lock">🔒</span>
            <input type="text" id="browserAddressInput" placeholder="Enter URL or search query...">
          </div>

          <div class="action-controls">
            <button class="tool-btn" id="btnFullscreen" title="Fullscreen">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <div class="iframe-wrapper">
          <div class="loader-overlay hidden" id="iframeLoader">
            <div class="spinner"></div>
            <span>Loading website...</span>
          </div>
          <iframe id="proxyIframe" src="about:blank"></iframe>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Powered by <a href="https://github.com/MercuryWorkshop/scramjet" target="_blank" rel="noopener">Scramjet</a> &
        <a href="https://github.com/MercuryWorkshop/wisp-protocol" target="_blank" rel="noopener">Wisp Protocol</a></p>
    </footer>
  </div>

  <script src="/main.js" type="module"></script>
</body>

</html>
